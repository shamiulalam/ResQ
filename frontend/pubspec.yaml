name: resq
description: "ResQ — CBIR-based lost & stray pet matching app (CSE327 project)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Camera + Geolocation (Section 3: Frontend plugins)
  camera: ^0.10.5+9
  geolocator: ^11.0.0
  image_picker: ^1.1.2

  # Maps (Section 3: flutter_map + latlong2, free geofence radii/pins)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Networking to the FastAPI backend
  http: ^1.2.1

  # Cloud Firestore (Section 3: Database & Cloud Storage)
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.5
  firebase_auth: ^4.17.5
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.2.4
  file_picker: ^8.0.7
  # Kept at an Android API 34-compatible release for file_picker 8.x.
  flutter_plugin_android_lifecycle: 2.0.24
  mime: ^1.0.5

  # State management
  provider: ^6.1.2

  # Theme persistence
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.16.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
